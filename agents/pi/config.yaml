spec_version: 1
name: pi
description: Pi coding sub-agent — the multi-model REVIEW / EXPLORE / SEARCH specialist; judges diffs or investigates read-only tasks headlessly, on any gateway model picked per dispatch. Not dispatched as a fanout implementer — see skills/fanout/SKILL.md, which routes IMPLEMENT tasks only to claude_code/codex/opencode/cursor/hermes/agy.

# Headless scaffold harness (no terminal wrapper): the worker runs in-process
# behind the harness RPC contract, and its shell access flows through the
# bridged sys_os_* tools, so every command passes the policy layer.
executor:
  type: omnigent
  config:
    harness: pi

prompt: |
  You are Pi, a coding sub-agent dispatched by the polly
  orchestrator for a single scoped task in a dedicated git worktree. You are
  the REVIEW / EXPLORE / SEARCH specialist — the roster does not route
  IMPLEMENT tasks to you (see `skills/fanout/SKILL.md`); your task prompt
  names its purpose as REVIEW, EXPLORE, or SEARCH. Do exactly that one thing;
  don't refactor or wander unprompted.

  REVIEW — verify another agent's diff (you are given the diff + the acceptance
  contract):
  - Judge the diff ONLY against the contract. Do NOT edit code — surface issues
    for the orchestrator to route.
  - Report blocking issues, non-blocking issues, and suggestions separately,
    each with file:line evidence.

  EXPLORE / SEARCH — answer a specific question, read-only:
  - Read only what you need; edit nothing. Answer with file:line evidence.

  Always return a clear, structured result: your findings, with file:line
  evidence. Note anything that did not fit the task.

# read_only_os (below) only denies the direct file-write tool calls
# (Write/Edit/MultiEdit, sys_os_write/edit) — it does NOT reach a shell tool,
# so sandbox.type: none left sys_os_shell free to bypass it entirely
# (`printf x > file`, `sed -i`, `rm`, `git commit -am`, all otherwise ALLOW).
# `type: auto` picks the OS-appropriate real sandbox (linux_bwrap /
# darwin_seatbelt) and, since write_paths is left at its empty default, mounts
# cwd read-only at the kernel level for the ENTIRE Pi subprocess tree —
# including its shell tool — so those same commands now fail as OS
# permission errors instead of silently succeeding. Genuinely closes the
# shell escape hatch instead of trying to pattern-match write-shaped
# commands, which is what the (still useful, layered) policies below do.
# read_paths / cwd_allow_hidden grant just enough read access for ordinary
# review commands (git log/diff/blame need ~/.gitconfig and cwd's .git/,
# both otherwise masked) without widening any write access.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: auto
    read_paths: ["~/.gitconfig"]
    cwd_allow_hidden: [".venv", ".git"]

# Pi is review/explore/search-only — it never opens a PR and has no
# legitimate reason to write a file or push, unlike the implementer bundles
# (claude_code/codex/opencode/cursor/hermes/agy) this guardrails block was
# originally copied from. read_only_os hard-denies every file-mutating tool
# call outright (belt), the os_env.sandbox above hard-denies shell-mediated
# writes at the OS level (suspenders — closes exactly the gap the belt
# alone misses), and blast_radius denies push/PR-merge/deploy outright
# (risky_action: DENY, not the ASK default) since Pi has no legitimate case
# where a human should be prompted to let it push. The catastrophic set
# (force-push, rm -rf /, hard-reset to a remote ref) was already
# unconditionally denied either way.
guardrails:
  policies:
    read_only_os:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.read_only_os
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: true
          risky_action: DENY
          deny_reason: >-
            Pi is review/explore/search-only and never pushes, merges, or
            deploys — that's the implementer's job, and its own PR.
